# California MeshCore region tree — the source of truth.
#
# Edit this file, then run `npm run build:regions` to regenerate
# data/regions.json, which is what the site loads and what anything outside
# this repo should consume. Both files are committed; CI checks they agree.
#
# ---------------------------------------------------------------------------
# The shape
#
#   root      Tokens prefixed to every generated chain. Not selectable.
#   levels    What to call each level below the root, outermost first. Naming
#             is by depth, so a tree with four levels just lists four names.
#   places    The tree. Nesting is arbitrary: a place may have children, and
#             those children may have children, for as deep as the firmware's
#             eight-level chain limit allows (root included).
#
# A place:
#
#   code      Required. Lowercase a-z0-9, 1-8 characters, and unique across
#             the WHOLE file — MeshCore region names are a flat namespace on
#             the node, so two places sharing a code collide on any repeater
#             that carries both. `npm run validate` enforces this.
#
#             Codes are stable: once one is in use on real hardware, renaming
#             it breaks every node that has it.
#
#   name      Required. What people read. Never travels over the air.
#   kind      Optional. Overrides the level name for this place, for a branch
#             that is deeper or shallower than its siblings.
#   blurb     Optional. One line of context.
#   outline   Optional. Name of a shape in data/counties.json, which makes the
#             map draw this place as a boundary rather than a point.
#   lat/lon   Optional. One representative point. Drives the map dot and the
#             "where is this repeater?" suggestion, so a wrong one silently
#             mis-places somebody.
#   nudge     Optional [x, y] in map units, to shift this place's map label
#             clear of the dots around it.
#   aliases   Optional search terms — town names, nicknames. They never appear
#             in the generated commands; they exist so someone can type
#             "Paso Robles" and find `prb`.
#   children  Optional. More places, same shape.
# ---------------------------------------------------------------------------

# Bumped only when the shape above changes in a way that breaks readers.
format: 1

name: California
description: MeshCore repeater region scopes for California, as a tree of nested places.
updated: 2026-07-31
license: MIT
source: https://github.com/matkam/meshcore-settings

limits:
  # One serial line is 160 characters, so a generated command cannot exceed it.
  maxLineLength: 160
  # MAX_REGION_ENTRIES in the firmware's RegionMap.h — the size of a node's
  # region table. Past it, region put/def fills what it can and rejects the
  # rest, leaving the node half configured.
  maxRegionNames: 32
  # The firmware walks at most eight levels, root tokens included.
  maxDepth: 8

# Prefixed to every chain, and not selectable: everything on this site is
# somewhere in California, so there is nothing to choose here.
root:
  - code: west
    name: Western US
  - code: ca
    name: California

# Indexed by depth below the root. Anything deeper than this list is described
# generically, and a single place can override its own with `kind`.
levels:
  - { name: region, plural: regions }
  - { name: county, plural: counties }
  - { name: local area, plural: local areas }

