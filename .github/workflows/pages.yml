name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Previews push to the same branch, so serialise all publishes.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # validate rebuilds data/regions.json from the YAML to check they agree,
      # which needs the YAML parser. The site itself still has no dependencies.
      - run: npm install --no-audit --no-fund
      - run: npm run validate
      - run: .github/scripts/publish.sh
