name: Validate region data

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # validate rebuilds data/regions.json from the YAML to check they agree,
      # which needs the YAML parser. The site itself still has no dependencies.
      - run: npm install --no-audit --no-fund
      - run: npm run validate
