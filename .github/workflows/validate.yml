name: Validate region data

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Needs the YAML parser. The site itself still has no dependencies.
      - run: npm install --no-audit --no-fund

      # Builds the JSON from the YAML and validates that, rather than insisting
      # the committed JSON already matches. A contributor edits regions.yaml and
      # nothing else; keeping the two in step is main's job, not theirs.
      - run: npm run validate:built
