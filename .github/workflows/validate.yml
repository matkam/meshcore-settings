name: Validate region data

# Pull requests only. A same-repo branch used to be validated twice — once for
# the push and again for the pull_request — and a fork's pushes never reach this
# repo at all, so pull_request is the trigger that actually covers everyone.
# main is covered by test.yml and by the build that gates the deploy.
on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Needs the YAML parser. The site itself still has no dependencies.
      - run: npm install --no-audit --no-fund

      # Builds the JSON from the YAML and validates that, rather than insisting
      # the committed JSON already matches. A contributor edits regions.yaml and
      # nothing else; keeping the two in step is main's job, not theirs.
      - run: npm run validate:built
