name: Rebuild region data

# Keeps data/regions.json in step with data/regions.yaml on main, so that
# changing a region is a one-file edit. PRs build the JSON rather than checking
# it (see validate.yml), which means a merged branch can leave a committed JSON
# that lags the YAML it came from — this puts it back.
#
# The commit is made with the default GITHUB_TOKEN, and GitHub deliberately does
# not start workflow runs for those, so this cannot set off another publish. The
# paths-ignore below is belt and braces for the same thing.
on:
  push:
    branches: [main]
    paths:
      - "data/regions.yaml"
      - "scripts/build-regions.mjs"
      - "scripts/print-json.mjs"

permissions:
  contents: write

# Never race another rebuild on the same branch.
concurrency:
  group: rebuild-regions
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund
      - run: npm run build:regions

      # Nothing to do on the common path, where whoever pushed had already
      # rebuilt. Only a real difference is worth a commit.
      - name: Commit the rebuild if it changed anything
        run: |
          set -euo pipefail
          if git diff --quiet -- data/regions.json; then
            echo "data/regions.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/regions.json
          git commit -m "Rebuild data/regions.json from the YAML

          Generated by .github/workflows/rebuild.yml. The source of truth is
          data/regions.yaml; this keeps the built file in step with it."
          git push
