name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  preview:
    # Forks get a read-only token, so they cannot publish. Skip rather than
    # fail, and never use pull_request_target to work around it -- that would
    # run fork code with a write token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove the preview when the PR closes
        if: github.event.action == 'closed'
        run: .github/scripts/unpublish.sh "pr-${{ github.event.number }}"

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 20

      - name: Install the build tooling
        if: github.event.action != 'closed'
        run: npm install --no-audit --no-fund

      - name: Validate region data
        if: github.event.action != 'closed'
        run: npm run validate

      - name: Publish preview
        if: github.event.action != 'closed'
        run: .github/scripts/publish.sh "pr-${{ github.event.number }}"

      - name: Link the preview from the PR
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.number }}/
        run: |
          BODY=$(cat <<EOF
          **Preview:** $URL

          Served over HTTPS, so Web Serial and Web Bluetooth work — you can connect a
          companion node and try the push panel against a real repeater. Updates on
          every push to this branch and is deleted when the PR closes.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
          )
          # Keep one comment rather than one per push.
          gh pr comment "${{ github.event.number }}" --edit-last --body "$BODY" \
            || gh pr comment "${{ github.event.number }}" --body "$BODY"
