name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The site itself has no dependencies. This is Playwright, for the tests.
      - run: npm install

      # Chromium only — the suites drive Web Serial and Web Bluetooth, which
      # Firefox and WebKit don't implement, so there is nothing to gain there.
      - run: npx playwright install --with-deps chromium

      # Build from the YAML rather than checking the committed JSON — see the
      # note in validate.yml. The suites read data/regions.json, so this also
      # means they run against what the contributor actually wrote.
      - run: npm run validate:built

      - run: npm test

      # Uploaded whether or not anything failed. The map is data-driven and
      # forks get no preview deployment, so for most contributors this is the
      # only way to see what their change looks like before it is merged.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
