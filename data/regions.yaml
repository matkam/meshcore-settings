# California MeshCore region tree — the source of truth.
#
# Edit this file, then run `npm run build:regions` to regenerate
# data/regions.json, which is what the site loads and what anything outside
# this repo should consume. Both files are committed; CI checks they agree.
#
# ---------------------------------------------------------------------------
# The shape
#
#   root      Tokens prefixed to every generated chain. Not selectable.
#   levels    What to call each level below the root, outermost first. Naming
#             is by depth, so a tree with three levels just lists three names.
#   places    The tree. Nesting is arbitrary and deliberately ragged: a region
#             may hold areas which hold local areas, or hold local areas
#             directly where there is nothing in between worth naming.
#   tags      Extra region names that are NOT levels. A tag sits directly under
#             the root and nothing nests inside it; places opt into one with
#             `tags:`, and every place beneath them carries it too. Use one for
#             a scope that cuts across the tree when giving those places a
#             common parent would be wrong — for example, because they sit in
#             separate RF basins and a shared level would imply they hear each
#             other. Making a tag into a level costs every node beneath it a
#             table entry whether or not its operator wanted the wider scope.
#
# A place:
#
#   code      Required. Lowercase a-z0-9, 1-30 characters, and unique across
#             the WHOLE file — MeshCore region names are a flat namespace on
#             the node, so two places sharing a code collide on any repeater
#             that carries both. `npm run validate` enforces this.
#
#             30 is the firmware's ceiling: RegionEntry.name is char[31].
#             Length costs nothing on the air — a scoped packet carries a
#             16-bit transport code derived from the name, never the name —
#             so prefer the word people say over an abbreviation they have to
#             look up. Established vernacular is the exception worth making:
#             `sf` and `slo` are what operators already type. Either way the
#             code describes the whole area: a town's name on a wider area
#             tells every other town in it that the scope isn't theirs.
#
#             Codes are stable: once one is in use on real hardware, renaming
#             it breaks every node that has it, so get it right before anyone
#             deploys it rather than after.
#
#   name      Required. What people read. Never travels over the air. It has
#             to make sense on its own — "South County" meant something when
#             a county sat above it and means nothing now that one doesn't.
#   kind      Optional. Overrides the level name for this place, for a branch
#             that is deeper or shallower than its siblings.
#   blurb     Optional. One line of context.
#   short     Optional. What the map label says, when the code is too long to
#             read at map size. Defaults to the code.
#   outline   Optional. A shape name from data/outlines.json, or a list of
#             them, which makes the map draw this place as a boundary rather
#             than a point. A place claims every shape it wholly contains;
#             where a place cuts across a shape, nobody claims it and it draws
#             as plain background.
#   county    Optional, and NOT a level — it never appears in a generated
#             chain. It records which county a local area sits in, which gives
#             the validator its point-in-boundary check back now that counties
#             are not places, and makes the county name searchable.
#   lat/lon   Optional. One representative point. Drives the map dot and the
#             "where is this repeater?" suggestion, so a wrong one silently
#             mis-places somebody.
#   nudge     Optional [x, y] in map units, to shift this place's map label
#             clear of the dots around it.
#   aliases   Optional search terms — town names, nicknames. They never appear
#             in the generated commands; they exist so someone can type
#             "Paso Robles" and land on `slonorth`.
#   tags      Optional. Codes from the `tags` list above, carried by this place
#             and everything under it, as a second short chain from the root.
#   children  Optional. More places, same shape.
#
# ---------------------------------------------------------------------------
# Why the tree looks like this
#
# A place is a community first: somewhere people name and identify with.
# Three things shape where its edges fall, and none of them overrides that.
#
#   Political boundaries. County and city lines usually match communities, so
#   they are the usual edge. Where they don't, the community wins: Lake Tahoe
#   is one place across three counties.
#   RF propagation. A ridge can make two nearby communities separate meshes;
#   flat open ground is a reason not to cut one community into pieces.
#   Mesh density. A place needs repeaters to carry its scope. Plenty of them
#   can justify a split, along community lines. Thin coverage is a reason not
#   to split further, not on its own a reason to fold one town into another.
#
# The tree is seeded at counties and grown by locals. County lines need no
# guesswork, so the tree stops there; finer areas come from the operators who
# run that mesh, once they have the repeaters to carry them. Adding children
# later breaks nothing; taking a level away leaves dead names on hardware.
# SLO County is the first branch grown that way.
# ---------------------------------------------------------------------------

# Bumped only when the shape above changes in a way that breaks readers.
format: 2

name: California
description: MeshCore repeater region scopes for California, as a tree of nested places.
# Quoted on purpose: unquoted, YAML resolves this to a timestamp and a parser
# hands back a date object, where regions.json always has a string. Keep the
# quotes so both files mean the same thing to whoever reads them.
updated: "2026-10-24"
license: MIT
source: https://github.com/matkam/meshcore-settings

limits:
  # One serial line is 160 characters, so a generated command cannot exceed it.
  maxLineLength: 160
  # MAX_REGION_ENTRIES in the firmware's RegionMap.h — the size of a node's
  # region table. Past it, region put/def fills what it can and rejects the
  # rest, leaving the node half configured.
  maxRegionNames: 32
  # The firmware walks at most eight levels, root tokens included.
  maxDepth: 8
  # RegionEntry.name is char[31] in the firmware, so 30 usable characters.
  maxCodeLength: 30

# Prefixed to every chain, and not selectable: everything on this site is
# somewhere in California, so there is nothing to choose here.
root:
  - code: us
    name: United States
  - code: west
    name: Western US
  - code: california
    name: California

# Indexed by depth below the root. Anything deeper than this list is described
# generically, and a single place can override its own with `kind`.
levels:
  - { name: region, plural: regions }
  - { name: area, plural: areas }
  - { name: local area, plural: local areas }

# Extra region names carried alongside a place's chain. Not levels: nothing
# nests under a tag, and a place opts in rather than inheriting one by position.
# (None declared.)
tags: []

